[alembic]

# Migration 脚本目录
script_location = %(here)s/alembic

# 将 backend/ 加入 Python import path
prepend_sys_path = %(here)s

# 文件命名格式
file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 路径分隔符
path_separator = os

# 数据库 URL 不在这里保存。
# 我们会在 alembic/env.py 中从 .env 读取 DATABASE_URL。
sqlalchemy.url =


# ============================================================
# Logging
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
